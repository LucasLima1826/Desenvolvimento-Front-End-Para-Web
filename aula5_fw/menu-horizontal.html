<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo W3schools - menu horizontal</title>
    <style>
        .nav{
            background-color: lightblue;
            list-style-type: none;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .nav li{
            display: inline-block;
            font-size: 18px;
            padding: 15px;
        }
    </style>
</head>
<body>
    <h1>Menu horizontal- Navigation Menu</h1>
    <p>Testando um Menu na horizontal - Utilizamos o CSS para estiliza-los</p>
    <ul class="nav">
        <li><a href="#home">Home</a></li>
        <li><a href="#Novo">Novo</a></li>
        <li><a href="#Contato">Contato</a></li>
        <li><a href="#Empresa">Empresa</a></li>
    </ul>
</body>
</html>
